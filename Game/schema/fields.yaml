# Описания и допустимые диапазоны всех полей манифестов.
# Имена и типы полей берутся из кода (OSDataTypes.h); здесь — только то, чего в коде нет.
# Из этого файла собирается Docs/REFERENCE.md. Каждое поле обязано иметь описание.

FOSActionDef:
  Id: { doc: "Имя действия. На него ссылаются слоты, комбо и профили ИИ." }
  Duration: { doc: "Длительность в секундах. 0 — действие длится, пока удерживается кнопка (блок).", min: 0 }
  StaminaCost: { doc: "Сколько выносливости тратится при старте. Начать можно, если выносливость выше нуля.", min: 0 }
  StaminaRegenScale: { doc: "Множитель восстановления выносливости, пока идёт действие (в блоке — меньше 1).", min: 0 }
  Windows: { doc: "Окна: когда бьёт оружие, когда персонаж неуязвим, блокирует, может прервать действие." }
  ComboNext: { doc: "Действие, которое начнётся вместо обычного, если ту же кнопку нажать во время этого. Так строится комбо." }
  AutoNext: { doc: "Действие, которое начнётся само, когда это закончится. Так строятся серии ударов врагов." }
  DamageScale: { doc: "Множитель урона оружия для этого удара.", min: 0 }
  PoiseDamageScale: { doc: "Множитель урона по балансу для этого удара.", min: 0 }
  Unblockable: { doc: "Удар проходит сквозь блок и идеальный блок." }
  MoveDistance: { doc: "Рывок: на сколько сантиметров персонаж сдвинется между MoveStart и MoveEnd.", min: 0 }
  MoveStart: { doc: "Когда начинается рывок.", min: 0 }
  MoveEnd: { doc: "Когда рывок заканчивается.", min: 0 }
  MoveDirection: { doc: "Куда рывок: вперёд, назад или куда хочет персонаж (стик у игрока, к цели у врага; без ввода — назад)." }
  SnapFacing: { doc: "В первый кадр повернуться к цели (или в сторону движения)." }
  TrackingEnd: { doc: "До этой секунды персонаж продолжает доворачиваться к цели. Чем больше, тем труднее увернуться.", min: 0 }
  MoveSpeedScale: { doc: "Доля обычной скорости ходьбы, доступная во время действия. 0 — персонаж стоит на месте.", min: 0, max: 1 }
  FitAnimation: { doc: "Растянуть или сжать анимацию этого действия (её задаёт набор анимаций персонажа), чтобы она длилась ровно Duration." }

FOSActionWindow:
  Type: { doc: "`Hit` — оружие бьёт; `Invulnerable` — удары проходят мимо; `Guard` — блок; `PerfectGuard` — идеальный блок, атакующий оглушён; `HyperArmor` — урон проходит, но не сбивает; `Cancel` — можно начать другое действие." }
  Start: { doc: "Секунда от начала действия, когда окно открывается.", min: 0 }
  End: { doc: "Секунда, когда окно закрывается. Не указано — до конца действия.", min: 0 }

FOSWeaponDef:
  Id: { doc: "Имя оружия. На него ссылается поле Weapon персонажа." }
  Damage: { doc: "Урон по здоровью за удар.", min: 0 }
  PoiseDamage: { doc: "Урон по балансу за удар. Когда баланс цели кончается, она оглушена.", min: 0 }
  Reach: { doc: "Длина зоны удара перед персонажем, в сантиметрах.", min: 1 }
  Radius: { doc: "Толщина зоны удара (радиус), в сантиметрах.", min: 1 }
  GuardDamageReduction: { doc: "Какая доля урона гасится блоком: 1 — весь, 0 — ничего.", min: 0, max: 1 }
  GuardStaminaScale: { doc: "Сколько выносливости отнимает каждая единица заблокированного урона.", min: 0 }
  GuardAngle: { doc: "Ширина сектора перед персонажем, который закрывает блок, в градусах: 180 — вся передняя половина, 360 — блок со всех сторон.", min: 0, max: 360 }
  Actions: { doc: "Слот → действие. Обычно здесь `Light`, `Heavy`, `Guard`." }
  Mesh: { doc: "Модель оружия. Необязательно.", asset: StaticMesh }
  AttachSocket: { doc: "Имя кости или сокета, к которому крепится модель оружия." }

FOSCharacterDef:
  Id: { doc: "Имя персонажа. По нему враг ставится на уровень." }
  DisplayName: { doc: "Имя, которое видит игрок (над полосой здоровья босса)." }
  MaxHealth: { doc: "Здоровье.", min: 1 }
  MaxStamina: { doc: "Выносливость.", min: 0 }
  StaminaRegen: { doc: "Восстановление выносливости в секунду.", min: 0 }
  StaminaRegenDelay: { doc: "Пауза после траты выносливости, прежде чем она начнёт восстанавливаться.", min: 0 }
  MaxPoise: { doc: "Баланс. 0 — любой удар оглушает (как у игрока).", min: 0 }
  PoiseResetDelay: { doc: "Через сколько секунд без ударов баланс восстанавливается полностью.", min: 0 }
  WalkSpeed: { doc: "Скорость ходьбы, см/с.", min: 0 }
  SprintSpeed: { doc: "Скорость бега, см/с.", min: 0 }
  SprintStaminaPerSecond: { doc: "Расход выносливости на бег в секунду.", min: 0 }
  TurnRate: { doc: "Скорость разворота, градусов в секунду: и по ходу движения, и к цели. Чем меньше, тем легче зайти врагу за спину.", min: 0 }
  Acceleration: { doc: "Как быстро персонаж набирает скорость, см/с². Меньше — «тяжелее» на старте.", min: 0 }
  BrakingDeceleration: { doc: "Как быстро останавливается, когда ввод отпущен, см/с². Меньше — скользит.", min: 0 }
  Weapon: { doc: "Оружие персонажа." }
  Actions: { doc: "Слот → действие. Обычно здесь `Dodge` и реакции: `Stagger`, `GuardBreak`, `Parried`, `Death`." }
  AIProfile: { doc: "Профиль поведения. У игрока не указывается." }
  CurrencyReward: { doc: "Сколько осколков получает игрок за убийство.", min: 0 }
  Boss: { doc: "Босс: получает большую полосу здоровья внизу экрана и сообщение о победе." }
  Scale: { doc: "Размер относительно обычного человека. Увеличивает и зону удара.", min: 0.1, max: 10 }
  PlaceholderColor: { doc: "Цвет временной фигуры-заглушки, в кавычках: `\"#B0503A\"`." }
  Mesh: { doc: "Модель персонажа. Без неё показывается цветная заглушка.", asset: SkeletalMesh }
  MeshYaw: { doc: "Поворот модели, если она смотрит не туда. У большинства моделей −90.", min: -180, max: 180 }
  AnimationSet: { doc: "Набор анимаций для модели `Mesh`. Без него модель стоит в исходной позе." }

FOSAnimationSetDef:
  Id: { doc: "Имя набора. Набор подходит к одному скелету; персонажи с одной моделью могут делить один набор." }
  Idle: { doc: "Анимация стоя.", asset: Animation }
  Walk: { doc: "Анимация ходьбы.", asset: Animation }
  Run: { doc: "Анимация бега (спринта). Не задана — играется `Walk`.", asset: Animation }
  WalkSpeed: { doc: "При какой скорости ноги в `Walk` не скользят, см/с. Анимация ускоряется или замедляется под настоящую скорость. 0 — как есть.", min: 0 }
  RunSpeed: { doc: "То же для `Run`.", min: 0 }
  Actions: { doc: "Действие → анимация. Для действий, которых здесь нет, анимация не меняется.", asset: Animation }

FOSAIProfileDef:
  Id: { doc: "Имя профиля. На него ссылается поле AIProfile персонажа." }
  AggroRadius: { doc: "С какого расстояния враг замечает игрока, в сантиметрах.", min: 0 }
  LeashRadius: { doc: "Как далеко от своего места враг готов уйти, прежде чем бросит погоню и вернётся.", min: 0 }
  AttackDelayMin: { doc: "Самая короткая пауза между атаками.", min: 0 }
  AttackDelayMax: { doc: "Самая длинная пауза между атаками.", min: 0 }
  Moves: { doc: "Набор атак." }
  Phases: { doc: "Фазы после первой. Нужны боссам." }

FOSAIMoveDef:
  Action: { doc: "Какое действие выполнить." }
  MinRange: { doc: "Ближе этого расстояния атака не выбирается.", min: 0 }
  MaxRange: { doc: "Дальше этого расстояния атака не выбирается.", min: 0 }
  Weight: { doc: "Как часто атака выбирается среди подходящих: вес 3 выпадает втрое чаще веса 1.", min: 0 }
  Cooldown: { doc: "Сколько секунд атака недоступна после использования.", min: 0 }
  MinPhase: { doc: "С какой фазы атака доступна. 0 — с начала боя.", min: 0 }
  MaxPhase: { doc: "До какой фазы включительно атака доступна.", min: 0 }

FOSAIPhaseDef:
  HealthBelow: { doc: "Доля здоровья, при которой начинается фаза: 0.5 — половина.", min: 0, max: 1 }
  EnterAction: { doc: "Действие при входе в фазу (рёв, смена стойки). Необязательно." }

Level:
  Map: { doc: "Путь карты в игре: `/Game/Maps/L_Имя`. У каждого уровня свой." }
  Lighting: { doc: "Имя набора освещения из `Game/lighting.yaml`." }
  PlayerStart: { doc: "Где появляется игрок." }
  Blocks: { doc: "Геометрия уровня." }
  Shrines: { doc: "Святилища." }
  Enemies: { doc: "Враги." }
  Exits: { doc: "Выходы на другие карты." }

LevelStart:
  At: { doc: "Точка появления. Ставьте на 100 см выше пола." }
  Yaw: { doc: "Куда игрок смотрит при появлении.", min: -360, max: 360 }

LevelBlock:
  Name: { doc: "Имя блока, уникальное в пределах уровня." }
  At: { doc: "Центр блока." }
  Size: { doc: "Размеры по `x`, `y`, `z` в сантиметрах." }
  Rotation: { doc: "Поворот `[наклон, разворот, крен]` в градусах. Для пандуса — наклон или крен." }

LevelShrine:
  Id: { doc: "Имя святилища. Хранится в сохранении, поэтому уникально во всей игре." }
  At: { doc: "Где стоит. Ставьте на 80 см выше пола." }
  Yaw: { doc: "Куда святилище обращено; игрок возрождается перед ним.", min: -360, max: 360 }
  InteractRadius: { doc: "С какого расстояния можно отдохнуть, в сантиметрах. 0 — как задано в `Game/game.yaml`.", min: 0 }
  RespawnDistance: { doc: "На каком расстоянии перед святилищем появляется игрок, в сантиметрах.", min: 0 }
  RespawnHeight: { doc: "На сколько выше святилища появляется игрок, в сантиметрах. Должно хватать, чтобы не застрять в полу.", min: 0 }
  Name: { doc: "Имя объекта в редакторе. Необязательно." }

LevelExit:
  Id: { doc: "Имя выхода. На него ссылаются выходы других карт, поэтому уникально во всей игре." }
  At: { doc: "Центр проёма. Проём — 2 м в ширину и 3 м в высоту, так что ставьте на 150 см выше пола." }
  Yaw: { doc: "Куда выход обращён — внутрь уровня. Пришедший через него игрок стоит перед ним и смотрит туда же.", min: -360, max: 360 }
  To: { doc: "`Id` выхода на другой карте, у которого появится игрок. Обратный путь — отдельный выход там со своим `To`." }
  RequiresDefeated: { doc: "`PersistentId` врага (обычно босса): пока он не побеждён, выход запечатан." }
  InteractRadius: { doc: "С какого расстояния можно пройти, в сантиметрах. 0 — как задано в `Game/game.yaml`.", min: 0 }
  ArrivalDistance: { doc: "На каком расстоянии перед выходом появляется пришедший через него игрок, в сантиметрах.", min: 0 }
  ArrivalHeight: { doc: "На сколько выше центра выхода он появляется, в сантиметрах.", min: 0 }
  Name: { doc: "Имя объекта в редакторе. Необязательно." }

LevelEnemy:
  Character: { doc: "Какой персонаж из `Game/data`." }
  At: { doc: "Где появляется. Ставьте на 100 см выше пола, крупных — выше." }
  Yaw: { doc: "Куда смотрит.", min: -360, max: 360 }
  PersistentId: { doc: "Если задано, убитый враг больше не появляется. Обязательно для боссов; уникально во всей игре." }
  Name: { doc: "Имя объекта в редакторе. Необязательно." }

LightingPreset:
  Id: { doc: "Имя набора." }
  SunPitch: { doc: "Высота солнца: −90 — в зените, около 0 — у горизонта.", min: -90, max: 0 }
  SunYaw: { doc: "С какой стороны светит солнце.", min: -360, max: 360 }
  Fog: { doc: "Добавить туман." }

FOSGameDef:
  PlayerCharacter: { doc: "Персонаж из `Game/data`, которым управляет игрок." }
  StartMap: { doc: "Карта, с которой начинается игра: поле `Map` одного из уровней." }
  InteractRadius: { doc: "С какого расстояния можно взаимодействовать с объектами мира, в сантиметрах.", min: 0 }
  Camera: { doc: "Камера." }
  LockOn: { doc: "Захват цели." }
  Controls: { doc: "Отклик управления." }
  Death: { doc: "Смерть и возрождение." }
  Messages: { doc: "Длительность сообщений." }

FOSCameraDef:
  ArmLength: { doc: "Расстояние от игрока до камеры, в сантиметрах.", min: 50 }
  HeightOffset: { doc: "На сколько камера выше центра игрока, в сантиметрах." }
  LagSpeed: { doc: "Как быстро камера догоняет игрока. Больше — жёстче; 0 — без запаздывания.", min: 0 }
  MouseSensitivity: { doc: "Чувствительность мыши: градусов на одно деление движения.", min: 0 }
  StickSpeed: { doc: "Скорость поворота камеры стиком, градусов в секунду при полном наклоне.", min: 0 }
  MinPitch: { doc: "Насколько камера может опуститься (смотреть снизу вверх), в градусах.", min: -89, max: 89 }
  MaxPitch: { doc: "Насколько камера может подняться (смотреть сверху вниз), в градусах.", min: -89, max: 89 }

FOSLockOnDef:
  AcquireDistance: { doc: "С какого расстояния цель можно захватить, в сантиметрах.", min: 0 }
  BreakDistance: { doc: "На каком расстоянии захват срывается. Не меньше AcquireDistance.", min: 0 }
  AcquireAngle: { doc: "Насколько далеко от центра экрана может быть цель, чтобы её захватить, в градусах.", min: 1, max: 180 }
  CameraSpeed: { doc: "Как быстро камера доворачивается к цели. Больше — резче.", min: 0 }
  CameraPitchOffset: { doc: "Наклон камеры относительно линии на цель, в градусах. Отрицательное — камера смотрит чуть ниже цели, цель оказывается выше центра экрана.", min: -45, max: 45 }
  PivotHeight: { doc: "С какой высоты над центром игрока камера целится, в сантиметрах. Без запаса близкая цель задирает камеру." }
  MinPitch: { doc: "Предел наклона камеры вниз при захвате, в градусах.", min: -89, max: 89 }
  MaxPitch: { doc: "Предел наклона камеры вверх при захвате, в градусах.", min: -89, max: 89 }

FOSControlsDef:
  InputBuffer: { doc: "Сколько секунд игра помнит нажатие, сделанное во время другого действия. Больше — управление прощает ранние нажатия.", min: 0, max: 2 }
  DodgeTapTime: { doc: "Для кнопки «уклонение или бег»: нажатие короче этого — уклонение, дольше — бег.", min: 0, max: 2 }

FOSDeathDef:
  RespawnDelay: { doc: "Сколько секунд проходит от смерти игрока до возрождения.", min: 0 }
  KillHeight: { doc: "Высота, ниже которой персонаж считается упавшим в пропасть и погибает, в сантиметрах." }
  CorpseLifetime: { doc: "Сколько секунд лежит тело убитого врага.", min: 0 }
  CurrencyLossFraction: { doc: "Какая доля осколков остаётся на месте смерти: 1 — все, 0.5 — половина, 0 — смерть ничего не отнимает.", min: 0, max: 1 }
  KeepPreviousDrop: { doc: "Что с осколками, не подобранными с прошлой смерти: `false` — сгорают, `true` — переносятся на новое место смерти." }

FOSMessagesDef:
  BossDefeatedDuration: { doc: "Надпись о победе над боссом.", min: 0 }
  RestedDuration: { doc: "Надпись об отдыхе у святилища.", min: 0 }

FOSInputDef:
  MoveForward: { doc: "Идти вперёд." }
  MoveBackward: { doc: "Идти назад." }
  MoveLeft: { doc: "Идти влево." }
  MoveRight: { doc: "Идти вправо." }
  MoveStick: { doc: "Движение стиком: `Gamepad_Left2D` или `Gamepad_Right2D`." }
  LookMouse: { doc: "Камера мышью: `Mouse2D`. Скорость — `Camera.MouseSensitivity`." }
  LookStick: { doc: "Камера стиком. Скорость — `Camera.StickSpeed`." }
  Light: { doc: "Лёгкая атака." }
  Heavy: { doc: "Тяжёлая атака." }
  Guard: { doc: "Блок, пока кнопка удерживается." }
  Dodge: { doc: "Уклонение по нажатию." }
  Sprint: { doc: "Бег, пока кнопка удерживается." }
  DodgeOrSprint: { doc: "Одна кнопка на два действия: коротко — уклонение, держать — бег. Порог — `Controls.DodgeTapTime`." }
  LockOn: { doc: "Захватить цель или отпустить её." }
  TargetLeft: { doc: "Переключить захват на цель левее." }
  TargetRight: { doc: "Переключить захват на цель правее." }
  Interact: { doc: "Взаимодействие. Эти же клавиши показываются в подсказке на экране." }

FOSTextsDef:
  InteractPrompt: { doc: "Подсказка взаимодействия. `{Keys}` — клавиши действия `Interact`, `{Prompt}` — что предлагает объект." }
  KeySeparator: { doc: "Чем разделяются клавиши в подсказке, если их несколько." }
  PromptInteract: { doc: "Что предлагает объект без собственной подсказки." }
  PromptShrine: { doc: "Что предлагает святилище." }
  PromptPickup: { doc: "Что предлагают осколки, оставшиеся на месте смерти." }
  PromptExit: { doc: "Что предлагает выход на другую карту." }
  PromptExitSealed: { doc: "Подсказка у выхода, который ещё запечатан (не побеждён враг из `RequiresDefeated`)." }
  Currency: { doc: "Счётчик осколков. `{Amount}` — сколько их." }
  MessageDied: { doc: "Надпись при смерти игрока." }
  MessageBossDefeated: { doc: "Надпись при победе над боссом." }
  MessageRested: { doc: "Надпись при отдыхе у святилища." }
  KeyLabels: { doc: "Как показывать клавиши в подсказках: имя клавиши → надпись. Не указанные показываются именем из движка." }

AssetPack:
  Id: { doc: "Имя набора; на него ссылаются ассеты." }
  Root: { doc: "Папка набора в проекте, например `/Game/ThirdParty/ParagonGreystone`. Если набор переложить, правится только эта строка." }

AssetEntry:
  Id: { doc: "Логическое имя: так ассет пишется в данных (`greystone_attack_a`)." }
  Type: { doc: "Что это: `SkeletalMesh` — модель персонажа, `StaticMesh` — модель оружия, `Animation` — анимация, `Sound` — звук, `Effect` — эффект частиц (Niagara или Cascade)." }
  Pack: { doc: "Из какого набора." }
  Path: { doc: "Папки и имя ассета внутри набора, без расширения: `Characters/Heroes/Greystone/Meshes/Greystone`. Точные пути — в `Docs/ASSET_INVENTORY.md`, который пишет конвейер контента." }
