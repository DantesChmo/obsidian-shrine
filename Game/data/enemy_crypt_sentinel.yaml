# Обычный враг «Страж склепа»: тяжёлый и медленный, его трудно оглушить.
# Бьёт булавой, вблизи отталкивает щитом, изредка отступает на шаг, чтобы снова размахнуться.
# Справочник всех полей: Docs/REFERENCE.md

Characters:
  - Id: crypt_sentinel
    DisplayName: Crypt Sentinel
    MaxHealth: 140
    MaxPoise: 80
    PoiseResetDelay: 5
    WalkSpeed: 200
    Weapon: sentinel_mace
    AIProfile: sentinel_ai
    CurrencyReward: 120
    Scale: 1.15
    PlaceholderColor: "#8A8F99"
    Actions:
      Stagger: react_stagger_heavy
      Parried: react_parried
      Death: react_death

Weapons:
  - Id: sentinel_mace
    Damage: 28
    PoiseDamage: 45
    Reach: 190
    Radius: 65

AIProfiles:
  - Id: sentinel_ai
    AggroRadius: 1000
    LeashRadius: 2200
    AttackDelayMin: 0.9
    AttackDelayMax: 1.8
    TurnRate: 220
    Moves:
      - { Action: sentinel_smash, MinRange: 0, MaxRange: 260, Weight: 3 }
      - { Action: sentinel_shove, MinRange: 0, MaxRange: 190, Weight: 2, Cooldown: 3 }
      - { Action: sentinel_step_back, MinRange: 0, MaxRange: 160, Weight: 1, Cooldown: 6 }

Actions:
  # Долгий замах, который не сбить, и тяжёлый удар.
  - Id: sentinel_smash
    Duration: 2.0
    SnapFacing: true
    TrackingEnd: 0.7
    DamageScale: 1.3
    MoveDistance: 80
    MoveStart: 0.75
    MoveEnd: 0.95
    Windows:
      - { Type: HyperArmor, Start: 0.0, End: 1.1 }
      - { Type: Hit, Start: 0.9, End: 1.1 }

  # Быстрый толчок: урона мало, но сбивает с ног.
  - Id: sentinel_shove
    Duration: 1.0
    SnapFacing: true
    TrackingEnd: 0.2
    DamageScale: 0.4
    PoiseDamageScale: 2.0
    MoveDistance: 120
    MoveStart: 0.2
    MoveEnd: 0.4
    Windows:
      - { Type: Hit, Start: 0.3, End: 0.45 }

  # Шаг назад без удара.
  - Id: sentinel_step_back
    Duration: 0.8
    MoveDirection: Backward
    MoveDistance: 220
    MoveStart: 0.1
    MoveEnd: 0.5
