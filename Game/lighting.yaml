# Наборы освещения. Уровень выбирает один по имени: `Lighting: outdoor_day`.
# Справочник всех полей: Docs/REFERENCE.md

Presets:
  - Id: outdoor_day
    SunPitch: -40
    SunYaw: 30
    Fog: true

  # Низкое закатное солнце и туман — для подземелий и руин.
  - Id: crypt_dusk
    SunPitch: -12
    SunYaw: 200
    Fog: true
